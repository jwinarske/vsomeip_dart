name: vsomeip_dart
description: >-
  Dart/Flutter FFI bridge to the COVESA vsomeip SOME/IP stack. Delivers
  automotive SOME/IP messages to Dart Streams via a zero-copy, worker-isolate
  design that never blocks the render thread.
version: 0.2.0

homepage:      https://github.com/meta-flutter/workspace-automation
repository:    https://github.com/meta-flutter/workspace-automation
issue_tracker: https://github.com/meta-flutter/workspace-automation/issues
documentation: https://pub.dev/documentation/vsomeip_dart/latest/

topics:
  - automotive
  - someip
  - vsomeip
  - ffi

funding:
  - https://github.com/sponsors/meta-flutter

environment:
  sdk: ">=3.10.0 <4.0.0"

platforms:
  linux:

dependencies:
  hooks:       ^1.0.2
  code_assets: ^1.0.0
  ffi:         ^2.1.0
  path:        ^1.9.0

dev_dependencies:
  lints:    ^6.0.0
  test:     ^1.24.0
  coverage: ^1.7.0
