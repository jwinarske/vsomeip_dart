# Codecov configuration for vsomeip_dart.
#
# Coverage targets reflect the test strategy from VSOMEIP_DART_PLAN.md:
#   - Dart sources under lib/src/ aim for 100%
#   - C++ bridge sources under src/ aim for 95%
#   - Generated and auto-generated code is excluded
#
# Pull-request status checks fail if these targets regress.

coverage:
  precision: 2
  round: down
  range: "85...100"

  status:
    project:
      default: false
      dart:
        target: 100%
        threshold: 0%
        flags: [dart]
        if_not_found: success
      cpp:
        target: 95%
        threshold: 1%
        flags: [cpp]
        if_not_found: success
    patch:
      default:
        target: 90%
        threshold: 5%

flags:
  dart:
    paths:
      - lib/src/
    carryforward: true
  cpp:
    paths:
      - src/
    carryforward: true

ignore:
  - "lib/generated/**"
  - "generated/**"
  - "src/test/**"
  - "src/dart_api_dl*"
  - "example/**"
  - "test/**"
  - "tools/**"

comment:
  layout: "header, diff, flags, files, footer"
  behavior: default
  require_changes: false
